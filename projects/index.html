<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Tanay Kohale</title>
<meta name="description" content="Every project, paper and build by Tanay Kohale, grouped by field.">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff8a4c'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%2307080c'%3ETK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .fieldhead { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 40px 0 10px; }
  .fcard { padding: 22px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .3s; }
  .fcard:hover { transform: translateY(-3px); }
  .fcard[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c), 0 0 40px color-mix(in srgb, var(--c) 20%, transparent); }
  .fcard b { display: block; font: 700 44px/1 var(--display); color: var(--c); letter-spacing: -1px; }
  .fcard span { display: block; margin-top: 10px; font-weight: 600; }
  .fcard small { color: var(--ink-3); font: 500 12px var(--mono); }
  .also { margin-top: 70px; padding: 26px; }
  .also h3 { margin: 0 0 12px; font: 500 12.5px var(--mono); letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); }
  .also p { margin: 0; color: var(--ink-2); }
</style>
</head>
<body data-root="../" data-page="work">
<canvas id="graph" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<header class="nav" id="nav"></header>
<main>
  <section class="wrap" style="padding-bottom:40px">
    <div class="eyebrow">All work</div>
    <h1 class="big reveal" style="font:600 clamp(46px,8vw,104px)/.95 var(--display);letter-spacing:-3px;margin:0 0 20px">Everything, <span class="serif" style="color:var(--ink-2)">by field.</span></h1>
    <p class="lede reveal">Projects, papers and builds. Choose a field to narrow it down — every card opens the full story.</p>
    <div class="fieldhead" id="fields"></div>
    <div class="pgrid" id="grid" style="margin-top:30px"></div>
    <div class="card also reveal">
      <h3>Also built</h3>
      <p>A WhatsApp bot that fetches and sends Google Images on request (Python, Twilio API) · a real-time chat interface and a 2D Flame game at Headsup (Flutter).</p>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/site.js"></script>
<script>
(function () {
  const colors = { ai: "#ff8a4c", data: "#7cc4ff", research: "#4fd1a5", apps: "#c3a6ff" };
  const grid = document.getElementById("grid"), fh = document.getElementById("fields");
  grid.innerHTML = PROJECTS.map(projectCard).join("");
  const count = (k) => PROJECTS.filter((p) => p.fields.includes(k)).length;
  fh.innerHTML = Object.entries(FIELDS).map(([k, v]) =>
    `<button type="button" class="card glow fcard reveal" style="--c:${colors[k]}" data-f="${k}" aria-pressed="false"><b>${String(count(k)).padStart(2, "0")}</b><span>${v.label}</span><small>projects</small></button>`).join("");
  function apply(f) {
    fh.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === f));
    grid.querySelectorAll(".pcard").forEach((c) => c.classList.toggle("hide", !!f && !c.dataset.fields.split(" ").includes(f)));
    const u = new URL(location.href); f ? u.searchParams.set("field", f) : u.searchParams.delete("field");
    history.replaceState(null, "", u);
  }
  fh.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    apply(b.getAttribute("aria-pressed") === "true" ? null : b.dataset.f);
  });
  const start = new URLSearchParams(location.search).get("field");
  apply(FIELDS[start] ? start : null);
  startGraph({ max: 50 });
  revealAll();
})();
</script>
</body>
</html>
