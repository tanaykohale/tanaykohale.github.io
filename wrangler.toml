# Cloudflare Workers settings for this site (free plan). Deployed automatically when the repository is pushed.
name = "tanay-site"
main = "_worker.js"
compatibility_date = "2026-01-01"
workers_dev = true
# Added once rachnava.in is active on Cloudflare:
# routes = [{ pattern = "*.rachnava.in/*", zone_name = "rachnava.in" }]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jobtool"
database_id = "19387a5b-4546-4092-a17b-4e631eef0de3"
